    name: Nathan Acks
    headline: Attendere ad singula
    email: nathan.acks@cardboard-iguana.com
    url: https://cardboard-iguana.com
    summary: |
      Nathan Acks is a security engineer and penetration tester with broad cross-domain experience. His offensive security work spans web applications, thick clients, mobile applications, and smart contracts, blending manual and automated techniques to assess risk, build threat models, and defeat the security mechanisms of the systems he evaluates. He is a deliberate generalist, emphasizing breadth and flexibility of ability rather than single-domain expertise.

      Nathan has developed and led a variety of trainings, ranging from multi-day security trainings for client software development teams to one-on-one workshops on operational security for non-technical staff. Before working for Bureau Veritas Cybersecurity, Nathan helped found the IT & Security Team at a national nonprofit, crafting organization-wide security policies, trainings, and strategy documents in partnership with legal and executive leadership. This experience grounds his technical work in deep understanding of real organizational and business needs.
